<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarjeta de perfil</title>
</head>
<body>
   <style>

.tarjeta{
    width:300px;
    margin:40px auto;
    padding:20px;
    border-radius:15px;
    text-align:center;
    background-color:#a9e4fc69;
}

.foto{
    width:150px;
    height:150px;
    border-radius:100px;
}

.nombre{
    font-size:25px;
    margin-top:8px;
}

.cargo{
    font-size:21px;
    color:rgba(59, 59, 59, 0.671);
}

.bio{
    margin-top:10px;
    font-size:18px;
    color: rgba(38, 0, 255, 0.712);
    text-align:center;
    
}
.boton{
    background:rgb(0, 0, 0);
    color:rgb(255, 255, 255);
    padding:10px 20px;
}

</style>
</head>
<body>
    <a href="../INDEX.HTML" class="boton">Volver a mis proyectos</a>
    <div class="tarjeta">
    <img class="foto" src="https://assets.dev-filo.dift.io/img/2019/07/28/0efef6fddc11fd70ad4ec62ccd33039a_sq.jpg" alt="foto">
    <h2 class="nombre">Ivan Ronaldo Rincon Neira</h2>
    <h3 class="cargo">Desarrollador de Software</h3>
    <p class="bio">
    Apasionado por la tecnología y el desarrollo de software. Me gusta aprender nuevas herramientas y crear soluciones tecnológicas que ayuden a resolver problemas.
    </p>
</div> 
</body>
</html>
